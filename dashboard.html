<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeCraftHub | Learning Dashboard</title>
  <style>
    :root { --purple:#8B5CF6; --purple-dark:#6D28D9; --amber:#F59E0B; --red:#EF4444; --ink:#211B36; --muted:#6B7280; --paper:#fff; --wash:#F5F3FF; --line:#E9E3FA; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:linear-gradient(135deg,#F8F7FF 0%,#FFF9EE 100%); color:var(--ink); min-height:100vh; }
    header { background:var(--ink); color:white; padding:30px max(20px,calc((100vw - 1120px)/2)); }
    header h1 { margin:0; font-size:clamp(1.6rem,3vw,2.35rem); letter-spacing:-.04em; }
    header p { margin:8px 0 0; color:#D8D1EE; }
    main { max-width:1120px; margin:0 auto; padding:28px 20px 56px; }
    .settings,.panel,.course-card { background:rgba(255,255,255,.94); border:1px solid var(--line); border-radius:18px; box-shadow:0 12px 28px rgba(57,33,112,.07); }
    .settings { display:flex; gap:12px; align-items:end; padding:16px; margin-bottom:22px; }
    .settings label { flex:1; color:var(--muted); font-size:.82rem; font-weight:700; }
    input,textarea,select { margin-top:6px; width:100%; border:1px solid #D9D3E8; border-radius:10px; padding:11px 12px; font:inherit; color:var(--ink); background:white; }
    input:focus,textarea:focus,select:focus { outline:3px solid #DDD6FE; border-color:var(--purple); }
    textarea { min-height:92px; resize:vertical; }
    .panel { padding:24px; }
    .panel-top { display:flex; gap:16px; justify-content:space-between; align-items:center; margin-bottom:18px; }
    h2 { font-size:1.18rem; margin:0; }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .wide { grid-column:1 / -1; }
    label { font-size:.88rem; font-weight:700; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
    button { border:0; border-radius:10px; padding:11px 15px; font:inherit; font-weight:800; cursor:pointer; transition:transform .15s,filter .15s; }
    button:hover { transform:translateY(-1px); filter:brightness(.96); }
    .primary { color:white; background:var(--purple); } .success { color:#3C2600; background:var(--amber); } .danger { color:white; background:var(--red); } .secondary { color:var(--purple-dark); background:#EDE9FE; }
    .notice { display:none; border-radius:10px; margin:0 0 18px; padding:12px 14px; font-weight:650; } .notice.show { display:block; } .notice.success { background:#FEF3C7; color:#78350F; } .notice.error { background:#FEE2E2; color:#991B1B; }
    .course-section { margin-top:26px; } .summary { color:var(--muted); font-size:.92rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:16px; }
    .course-card { padding:19px; display:flex; flex-direction:column; gap:12px; }
    .course-card h3 { margin:0; font-size:1.08rem; } .course-card p { margin:0; line-height:1.5; color:#514B63; white-space:pre-wrap; }
    .meta { display:flex; flex-wrap:wrap; gap:8px; color:var(--muted); font-size:.82rem; } .chip { background:var(--wash); color:var(--purple-dark); border-radius:99px; padding:5px 9px; font-weight:750; }
    .card-actions { display:flex; gap:8px; margin-top:auto; } .card-actions button { padding:8px 11px; font-size:.86rem; }
    .empty { text-align:center; padding:42px 16px; color:var(--muted); border:2px dashed #D8CFFC; border-radius:16px; }
    .spinner { display:inline-block; width:18px; height:18px; border:3px solid #E5E0F7; border-top-color:var(--purple); border-radius:50%; animation:spin .8s linear infinite; vertical-align:middle; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width:650px) { .settings { display:block; } .settings button { margin-top:10px; } .form-grid { grid-template-columns:1fr; } .wide { grid-column:auto; } header { padding:24px 20px; } }
  </style>
</head>
<body>
  <header><h1>CodeCraftHub: Your Learning Management Platform</h1><p>Plan your next skill, track progress, and celebrate every finished course.</p></header>
  <main>
    <section class="settings" aria-label="API settings">
      <label>Backend API URL<input id="api-url" type="url" value="http://localhost:5000/api/courses" aria-describedby="api-help"></label>
      <button id="save-api" class="secondary" type="button">Save URL &amp; Refresh</button>
    </section>
    <p id="api-help" class="summary">Node/Python: port 5000 · Spring Boot: change this URL to port 8080.</p>
    <div id="notice" class="notice" role="alert"></div>
    <section class="panel" aria-labelledby="form-heading">
      <div class="panel-top"><h2 id="form-heading">Add a course</h2><button id="cancel-edit" class="secondary" type="button" hidden>Cancel edit</button></div>
      <form id="course-form" novalidate>
        <div class="form-grid">
          <label>Course name<input id="name" name="name" required placeholder="e.g. JavaScript Fundamentals"></label>
          <label>Target completion date<input id="target_date" name="target_date" type="date" required></label>
          <label class="wide">Description<textarea id="description" name="description" required placeholder="What will you learn?"></textarea></label>
          <label>Status<select id="status" name="status" required><option>Not Started</option><option>In Progress</option><option>Completed</option></select></label>
        </div>
        <div class="actions"><button id="submit-button" class="primary" type="submit">Add course</button></div>
      </form>
    </section>
    <section class="course-section" aria-labelledby="courses-heading">
      <div class="panel-top"><div><h2 id="courses-heading">Your courses</h2><p id="summary" class="summary">Loading courses…</p></div><button id="refresh" class="secondary" type="button">Refresh</button></div>
      <div id="course-list" class="grid" aria-live="polite"><div class="empty"><span class="spinner"></span> Loading courses…</div></div>
    </section>
  </main>
  <script>
    const form = document.querySelector('#course-form');
    const fields = Object.fromEntries(['name','description','target_date','status'].map(id => [id, document.getElementById(id)]));
    const list = document.getElementById('course-list'); const notice = document.getElementById('notice');
    const summary = document.getElementById('summary'); const apiInput = document.getElementById('api-url');
    let editingId = null; let courses = [];
    apiInput.value = localStorage.getItem('codecrafthub-api-url') || apiInput.value;

    function apiUrl() { return apiInput.value.trim().replace(/\/$/, ''); }
    function message(text, type = 'success') { notice.textContent = text; notice.className = `notice ${type} show`; window.setTimeout(() => notice.classList.remove('show'), 5000); }
    function formatDate(value) { if (!value) return 'No date'; const date = new Date(value.length === 10 ? `${value}T00:00:00` : value); return Number.isNaN(date) ? value : date.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
    async function request(path = '', options = {}) {
      const response = await fetch(`${apiUrl()}${path}`, { headers:{'Content-Type':'application/json'}, ...options });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.details?.join('; ') || data.error || `Request failed (${response.status})`);
      return data;
    }
    function makeButton(label, className, handler) { const button = document.createElement('button'); button.type='button'; button.textContent=label; button.className=className; button.addEventListener('click', handler); return button; }
    function render() {
      list.replaceChildren(); summary.textContent = `${courses.length} course${courses.length === 1 ? '' : 's'} in your learning plan`;
      if (!courses.length) { const empty=document.createElement('div'); empty.className='empty'; empty.textContent='No courses yet. Add your first learning goal above.'; list.append(empty); return; }
      courses.forEach(course => {
        const card=document.createElement('article'); card.className='course-card';
        const title=document.createElement('h3'); title.textContent=course.name; const description=document.createElement('p'); description.textContent=course.description;
        const meta=document.createElement('div'); meta.className='meta';
        const status=document.createElement('span'); status.className='chip'; status.textContent=course.status;
        const target=document.createElement('span'); target.textContent=`Target: ${formatDate(course.target_date)}`;
        const created=document.createElement('span'); created.textContent=`Added: ${formatDate(course.created_at)}`; meta.append(status,target,created);
        const actions=document.createElement('div'); actions.className='card-actions'; actions.append(makeButton('Edit','secondary',() => beginEdit(course)),makeButton('Remove','danger',() => removeCourse(course)));
        card.append(title,description,meta,actions); list.append(card);
      });
    }
    async function loadCourses() {
      list.innerHTML='<div class="empty"><span class="spinner"></span> Loading courses…</div>'; summary.textContent='Contacting the backend…';
      try { const data=await request(); courses=Array.isArray(data) ? data : (data.courses || []); render(); }
      catch(error) { courses=[]; list.innerHTML='<div class="empty">Unable to load courses.</div>'; summary.textContent='Backend connection failed'; message(`${error.message}. Start the backend and verify the API URL.`, 'error'); }
    }
    function resetForm() { editingId=null; form.reset(); fields.status.value='Not Started'; document.getElementById('form-heading').textContent='Add a course'; document.getElementById('submit-button').textContent='Add course'; document.getElementById('cancel-edit').hidden=true; }
    function beginEdit(course) { editingId=course.id; Object.entries(fields).forEach(([key,input]) => input.value=course[key] || ''); document.getElementById('form-heading').textContent=`Edit: ${course.name}`; document.getElementById('submit-button').textContent='Save changes'; document.getElementById('cancel-edit').hidden=false; window.scrollTo({top:0,behavior:'smooth'}); fields.name.focus(); }
    async function removeCourse(course) { if (!confirm(`Remove "${course.name}"?`)) return; try { await request(`/${course.id}`,{method:'DELETE'}); message('Course removed.'); await loadCourses(); } catch(error) { message(error.message,'error'); } }
    form.addEventListener('submit', async event => { event.preventDefault(); if (!form.reportValidity()) return; const payload=Object.fromEntries(new FormData(form)); const submit=document.getElementById('submit-button'); submit.disabled=true; submit.textContent='Saving…'; try { await request(editingId ? `/${editingId}` : '',{method:editingId?'PUT':'POST',body:JSON.stringify(payload)}); message(editingId?'Course updated successfully.':'Course added successfully.'); resetForm(); await loadCourses(); } catch(error) { message(error.message,'error'); } finally { submit.disabled=false; submit.textContent=editingId?'Save changes':'Add course'; } });
    document.getElementById('cancel-edit').addEventListener('click',resetForm); document.getElementById('refresh').addEventListener('click',loadCourses);
    document.getElementById('save-api').addEventListener('click',() => { localStorage.setItem('codecrafthub-api-url',apiUrl()); resetForm(); loadCourses(); });
    loadCourses();
  </script>
</body>
</html>
